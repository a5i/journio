[package]
name = "journio-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Command-line interface for inspecting and managing journio durable workflows in SQLite or Postgres"
keywords = ["workflow", "cli", "orchestration", "journio", "database"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/journio-cli"

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "journio"
path = "src/main.rs"

[lib]
name = "journio_cli"
path = "src/lib.rs"

[dependencies]
journio-core = { workspace = true }
journio-postgres = { workspace = true }
journio-sqlite = { workspace = true }

clap = { workspace = true }
regex-lite = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["process", "signal"] }
tokio-postgres = "0.7"
uuid = { workspace = true }
chrono = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
