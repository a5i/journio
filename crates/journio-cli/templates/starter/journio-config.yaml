# Journio configuration for {{PROJECT_NAME}}.
name: {{PROJECT_NAME}}
language: rust

# Commands run by `journio start` (or `cargo run` directly).
runtimeConfig:
  start:
    - cargo run

# System database. SQLite for zero-config local dev;
# switch to postgres://... for production.
database_url: "sqlite://{{PROJECT_NAME}}.db"

database:
  migrate: []
