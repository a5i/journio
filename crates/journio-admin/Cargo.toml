[package]
name = "journio-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Admin HTTP server for the journio durable workflow orchestration engine"
keywords = ["workflow", "admin", "http", "orchestration", "axum"]
categories = ["web-programming::http-server", "development-tools"]
documentation = "https://docs.rs/journio-admin"

[package.metadata.docs.rs]
all-features = true

[dependencies]
journio-core = { workspace = true }

axum = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
journio-sqlite = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
