[package]
name = "journio-node-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node.js native binding for Journio"

[lib]
crate-type = ["cdylib"]

[dependencies]
journio-core = { workspace = true }
journio-postgres = { workspace = true }
journio-sqlite = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
napi = { version = "2", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "2"
once_cell = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
napi-build = "2"
